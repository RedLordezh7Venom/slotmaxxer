<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SlotMaxxer | AI Interview Scheduling</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .gradient-text { background: linear-gradient(90deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .input-pill { background: rgba(15, 23, 42, 0.5); border: 1px solid rgba(255, 255, 255, 0.2); transition: all 0.3s; }
        .input-pill:focus { border-color: #38bdf8; outline: none; box-shadow: 0 0 10px rgba(56, 189, 248, 0.3); }
        .btn-primary { background: linear-gradient(90deg, #0ea5e9, #6366f1); transition: transform 0.2s; }
        .btn-primary:hover { transform: scale(1.02); }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">
    <!-- Header -->
    <header class="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between mb-12">
        <div class="flex items-center gap-3">
            <div class="w-12 h-12 rounded-xl btn-primary flex items-center justify-center text-white text-2xl">
                <i class="fas fa-calendar-alt"></i>
            </div>
            <div>
                <h1 class="text-3xl font-bold tracking-tight">Slot<span class="gradient-text">Maxxer</span></h1>
                <p class="text-slate-400 text-sm">Automated Schedule Optimization</p>
            </div>
        </div>
        <nav class="mt-4 md:mt-0 flex gap-6 text-sm font-medium text-slate-400">
            <a href="#" class="hover:text-sky-400 transition">Dashboard</a>
            <a href="#" class="hover:text-sky-400 transition">History</a>
            <a href="#" class="hover:text-sky-400 transition">Settings</a>
        </nav>
    </header>

    <main class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-8">
        <!-- Configuration Column -->
        <div class="lg:col-span-2 space-y-8">
            <!-- Candidates Section -->
            <section class="glass-card rounded-2xl p-6 shadow-xl">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-xl font-semibold flex items-center gap-2">
                        <i class="fas fa-user-graduate text-sky-400"></i> Candidates
                    </h2>
                    <button onclick="addCandidate()" class="text-sm bg-sky-500/10 text-sky-400 px-3 py-1 rounded-full border border-sky-400/30 hover:bg-sky-500/20 transition">
                        + Add Candidate
                    </button>
                </div>
                <div id="candidate-list" class="space-y-4">
                    <!-- Dynamic Entry Template -->
                    <div class="candidate-entry flex flex-col md:flex-row gap-3 group">
                        <input type="text" placeholder="Candidate Name" class="flex-1 input-pill rounded-lg px-4 py-2 text-sm">
                        <input type="text" placeholder="Availability: e.g., Tue-Thu 2-5 PM" class="flex-[2] input-pill rounded-lg px-4 py-2 text-sm">
                        <button onclick="this.parentElement.remove()" class="opacity-0 group-hover:opacity-100 p-2 text-rose-500 hover:bg-rose-500/10 rounded-lg transition">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                </div>
            </section>

            <!-- Interviewers Section -->
            <section class="glass-card rounded-2xl p-6 shadow-xl">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-xl font-semibold flex items-center gap-2">
                        <i class="fas fa-user-tie text-indigo-400"></i> Interviewers
                    </h2>
                    <button onclick="addInterviewer()" class="text-sm bg-indigo-500/10 text-indigo-400 px-3 py-1 rounded-full border border-indigo-400/30 hover:bg-indigo-500/20 transition">
                        + Add Interviewer
                    </button>
                </div>
                <div id="interviewer-list" class="space-y-4">
                    <div class="interviewer-entry flex flex-col md:flex-row gap-3 group">
                        <input type="text" placeholder="Interviewer Name" class="flex-1 input-pill rounded-lg px-4 py-2 text-sm">
                        <input type="text" placeholder="Availability: e.g., Wed 9 AM-4 PM" class="flex-[2] input-pill rounded-lg px-4 py-2 text-sm">
                        <button onclick="this.parentElement.remove()" class="opacity-0 group-hover:opacity-100 p-2 text-rose-500 hover:bg-rose-500/10 rounded-lg transition">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                </div>
            </section>
        </div>

        <!-- Sidebar / Actions -->
        <div class="space-y-8">
            <section class="glass-card rounded-2xl p-6 shadow-xl sticky top-8">
                <h3 class="text-lg font-semibold mb-6">Settings</h3>
                
                <div class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium text-slate-400 mb-2">Duration (Minutes)</label>
                        <select id="duration" class="w-full input-pill rounded-lg px-4 py-2 text-sm">
                            <option value="30">30 Mins</option>
                            <option value="45">45 Mins</option>
                            <option value="60" selected>60 Mins</option>
                            <option value="90">90 Mins</option>
                        </select>
                    </div>

                    <button onclick="generateSchedule()" id="submit-btn" class="w-full btn-primary py-4 rounded-xl font-bold shadow-lg shadow-sky-500/20 flex items-center justify-center gap-2">
                        <i class="fas fa-sparkles"></i> Generate Optimal Schedule
                    </button>

                    <div class="bg-blue-500/10 border border-blue-400/20 rounded-xl p-4 text-xs text-blue-300 leading-relaxed">
                        <i class="fas fa-info-circle mr-1"></i> SlotMaxxer uses multi-factor quality scoring to reduce recruiter workload by up to 85%.
                    </div>
                </div>
            </section>
        </div>
    </main>

    <!-- Modal for Result (Invisible by default) -->
    <div id="loading-overlay" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md hidden flex flex-col items-center justify-center z-50">
        <div class="relative w-24 h-24 mb-6">
            <div class="absolute inset-0 border-4 border-sky-400/20 rounded-full"></div>
            <div class="absolute inset-0 border-4 border-sky-400 border-t-transparent rounded-full animate-spin"></div>
        </div>
        <p class="text-xl font-semibold animate-pulse">Running Optimization Engines...</p>
        <p class="text-slate-400 text-sm mt-2">AI is parsing availability & calculating optimal scores</p>
    </div>

    <!-- Scripting for Dynamic Forms -->
    <script>
        function addCandidate() {
            const list = document.getElementById('candidate-list');
            const div = document.createElement('div');
            div.className = 'candidate-entry flex flex-col md:flex-row gap-3 group animate-in fade-in slide-in-from-top-2 duration-300';
            div.innerHTML = `
                <input type="text" placeholder="Candidate Name" class="flex-1 input-pill rounded-lg px-4 py-2 text-sm">
                <input type="text" placeholder="Availability: e.g., Tue-Thu 2-5 PM" class="flex-[2] input-pill rounded-lg px-4 py-2 text-sm">
                <button onclick="this.parentElement.remove()" class="p-2 text-rose-500 hover:bg-rose-500/10 rounded-lg transition">
                    <i class="fas fa-times"></i>
                </button>
            `;
            list.appendChild(div);
        }

        function addInterviewer() {
            const list = document.getElementById('interviewer-list');
            const div = document.createElement('div');
            div.className = 'interviewer-entry flex flex-col md:flex-row gap-3 group animate-in fade-in slide-in-from-top-2 duration-300';
            div.innerHTML = `
                <input type="text" placeholder="Interviewer Name" class="flex-1 input-pill rounded-lg px-4 py-2 text-sm">
                <input type="text" placeholder="Availability: e.g., Wed 9 AM-4 PM" class="flex-[2] input-pill rounded-lg px-4 py-2 text-sm">
                <button onclick="this.parentElement.remove()" class="p-2 text-rose-500 hover:bg-rose-500/10 rounded-lg transition">
                    <i class="fas fa-times"></i>
                </button>
            `;
            list.appendChild(div);
        }

        async function generateSchedule() {
             const overlay = document.getElementById('loading-overlay');
             overlay.classList.remove('hidden');
             
             // ... logic will be added in next step to call API ...
             setTimeout(() => overlay.classList.add('hidden'), 2000);
        }
    </script>
</body>
</html>
