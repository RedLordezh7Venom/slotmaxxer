<svg width="600" height="300" viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: Solid Flat Color -->
  <rect width="600" height="300" fill="#2D2D2D"/>

  <!-- Recessed Slot: Flat, high-contrast -->
  <path d="M250 100 L350 150 L350 250 L250 200 Z" fill="#1A1A1A" stroke="#4D4D4D" stroke-width="2"/>
  <path d="M250 100 L350 150 L350 160 L250 110 Z" fill="#000000"/>

  <!-- Speed Lines: Solid, sharp -->
  <g stroke="#00FF41" stroke-width="3" stroke-linecap="square">
    <line x1="210" y1="90" x2="240" y2="105" />
    <line x1="200" y1="105" x2="230" y2="120" />
    <line x1="190" y1="120" x2="220" y2="135" />
  </g>

  <!-- Sliding Block: Solid, flat color -->
  <g>
    <path d="M240 90 L340 140 L340 180 L240 130 Z" fill="#00FF41" stroke="#FFFFFF" stroke-width="2"/>
    <!-- Top Face: Simple flat highlight -->
    <path d="M240 90 L290 115 L340 140 L290 115 Z" fill="#00CC33"/>
  </g>
</svg>